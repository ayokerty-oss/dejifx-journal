{% extends "base.html" %}
{% block title %}Add Trade — DejiFX{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Log a Trade</h1>
  <a href="/" class="btn">← Back</a>
</div>
<div class="card">
  <form method="POST" action="/add">
    <div class="form-row">
      <div class="form-group">
        <label>Date *</label>
        <input type="date" name="date" value="{{ today }}" required>
      </div>
      <div class="form-group">
        <label>Pair *</label>
        <select name="pair" required>
          {% for p in pairs %}<option value="{{ p }}">{{ p }}</option>{% endfor %}
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Session *</label>
        <select name="session" required>
          {% for s in sessions %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>HTF Bias *</label>
        <select name="htf_bias" required>
          <option value="bullish">Bullish</option>
          <option value="bearish">Bearish</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>LQ Swept</label>
        <select name="lq_swept">
          {% for l in lq_swept_options %}<option value="{{ l }}">{{ l }}</option>{% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Setup Type *</label>
        <select name="setup_type" required>
          {% for s in setup_types %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
        </select>
      </div>
    </div>
    <div class="form-col3">
      <div class="form-group">
        <label>Entry Trigger *</label>
        <select name="entry_trigger" required>
          {% for t in triggers %}<option value="{{ t }}">{{ t }}</option>{% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Entry TF</label>
        <select name="entry_tf">
          {% for tf in timeframes %}<option value="{{ tf }}">{{ tf }}</option>{% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Entry Time (NYT)</label>
        <input type="time" name="entry_time_nyt">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Stop Placement *</label>
        <select name="stop_placement" required>
          {% for s in stops %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Target *</label>
        <select name="target" required>
          {% for t in targets %}<option value="{{ t }}">{{ t }}</option>{% endfor %}
        </select>
      </div>
    </div>
    <div class="form-col3">
      <div class="form-group">
        <label>Outcome *</label>
        <select name="outcome" required>
          {% for o in outcomes %}<option value="{{ o }}">{{ o|capitalize }}</option>{% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>R:R Planned</label>
        <input type="number" step="0.01" name="rr_planned" placeholder="e.g. 3">
      </div>
      <div class="form-group">
        <label>R:R Actual</label>
        <input type="number" step="0.01" name="rr_actual" placeholder="e.g. 2.5">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Pips</label>
        <input type="number" step="0.1" name="pips">
      </div>
      <div class="form-group" style="display:flex;align-items:center;gap:8px;padding-top:20px;">
        <input type="checkbox" name="followed_rules" id="fr" checked style="width:auto;">
        <label for="fr" style="margin:0;color:var(--text);">Followed rules?</label>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
      <input type="checkbox" name="news_present" id="news" style="width:auto;">
      <label for="news" style="margin:0;color:var(--text);">News present?</label>
    </div>
    <div class="form-group">
      <label>News Name (if applicable)</label>
      <input type="text" name="news_name" placeholder="e.g. NFP, CPI">
    </div>
    <div class="form-group">
      <label>Mistake Tags</label>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;">
        {% for m in mistakes %}
        <label style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text);cursor:pointer;">
          <input type="checkbox" name="mistake_tags" value="{{ m }}" style="width:auto;">
          {{ m.replace('_',' ') }}
        </label>
        {% endfor %}
      </div>
    </div>
    <div class="form-group">
      <label>Notes</label>
      <textarea name="notes" placeholder="Observations, lessons, screenshots link…"></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Log Trade ✓</button>
  </form>
</div>
{% endblock %}
