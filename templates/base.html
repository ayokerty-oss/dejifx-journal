<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}DejiFX Journal{% endblock %}</title>
<style>
  :root {
    --bg: #0d1117; --bg2: #161b22; --bg3: #21262d;
    --border: #30363d; --text: #e6edf3; --muted: #8b949e;
    --green: #3fb950; --red: #f85149; --blue: #58a6ff;
    --yellow: #d29922; --purple: #bc8cff; --orange: #ffa657;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; }
  nav { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; gap: 24px; }
  nav a { color: var(--muted); text-decoration: none; font-weight: 500; }
  nav a:hover, nav a.active { color: var(--text); }
  nav .brand { color: var(--blue); font-weight: 700; font-size: 16px; }
  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg3); color: var(--text); text-decoration: none; font-size: 13px; cursor: pointer; }
  .btn:hover { background: var(--border); }
  .btn-primary { background: var(--green); border-color: var(--green); color: #000; font-weight: 600; }
  .btn-primary:hover { background: #56d364; }
  .btn-danger { background: var(--red); border-color: var(--red); color: #fff; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }
  .flash { padding: 10px 16px; border-radius: 6px; margin-bottom: 16px; font-size: 13px; }
  .flash.success { background: #0d4a1f; border: 1px solid var(--green); color: var(--green); }
  .flash.error { background: #4a0d0d; border: 1px solid var(--red); color: var(--red); }
  .flash.info { background: #0d2a4a; border: 1px solid var(--blue); color: var(--blue); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
  .badge-profit { background: #0d4a1f; color: var(--green); }
  .badge-loss { background: #4a0d0d; color: var(--red); }
  .badge-breakeven { background: #2a2a0d; color: var(--yellow); }
  .badge-pending { background: #1a1a2e; color: var(--purple); }
  .badge-bot { background: #1a2a3a; color: var(--blue); font-size: 10px; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  h2 { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
  .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 10px 12px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--border); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
  td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg2); }
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat-box { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
  .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-value { font-size: 22px; font-weight: 700; margin-top: 4px; }
  form label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  form input, form select, form textarea { width: 100%; padding: 8px 10px; background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 13px; }
  form input:focus, form select:focus, form textarea:focus { outline: none; border-color: var(--blue); }
  form textarea { resize: vertical; min-height: 80px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .form-group { margin-bottom: 14px; }
  .form-col3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .pending-banner { background: #12142a; border: 1px solid var(--purple); border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; color: var(--purple); display: flex; align-items: center; gap: 8px; }
  .pending-count { font-size: 20px; font-weight: 700; }
</style>
</head>
<body>
<nav>
  <span class="brand">⚡ DejiFX</span>
  <a href="/" {% if request.path == '/' %}class="active"{% endif %}>Trades</a>
  <a href="/add" {% if request.path == '/add' %}class="active"{% endif %}>+ Log Trade</a>
  <a href="/stats" {% if request.path == '/stats' %}class="active"{% endif %}>Stats</a>
</nav>
<div class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for cat, msg in messages %}
        <div class="flash {{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
